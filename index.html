<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aggie's Day</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aggie's Day">
<meta name="theme-color" content="#2A4A45">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F9F5EE;
  --warm:  #EDE8DE;
  --ink:   #1C1A17;
  --muted: #8A8478;
  --accent:#C4622D;
  --accent-light:#F0DDD3;
  --green: #2D6A4F;
  --green-light:#D6E9DC;
  --gold:  #B8922A;
  --gold-light:#F2E8CF;
  --mauve: #EDE0F0;
  --mauve-dark:#7B5EA7;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:60px;}

/* ── HEADER ── */
header{background:linear-gradient(135deg,#2A4A45 0%,#3A5E58 100%);color:#F9F5EE;padding:28px 24px 22px;position:relative;}
header::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(196,98,45,0.15);pointer-events:none;}
.header-title{font-family:'DM Serif Display',serif;font-size:28px;line-height:1.1;color:#F9F5EE;}
.header-title em{font-style:italic;color:#D4825A;}
.header-date{font-size:12px;font-weight:300;color:rgba(249,245,238,0.55);margin-top:4px;letter-spacing:.5px;text-transform:uppercase;}
.quick-links{display:flex;gap:8px;margin-top:18px;}
.quick-btn{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;border:1px solid rgba(249,245,238,0.25);background:rgba(249,245,238,0.1);color:#F9F5EE;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;}

/* ── DAY STRIP ── */
.day-strip{display:flex;gap:8px;padding:16px 20px;overflow-x:auto;scrollbar-width:none;background:var(--warm);border-bottom:1px solid rgba(28,26,23,0.08);}
.day-strip::-webkit-scrollbar{display:none;}
.day-pill{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:12px;cursor:pointer;background:transparent;border:1.5px solid transparent;transition:all .2s;font-family:'DM Sans',sans-serif;}
.day-pill.active{background:#1C1A17;color:var(--cream);}
.day-name{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);}
.day-pill.active .day-name{color:rgba(249,245,238,0.65);}
.day-num{font-family:'DM Serif Display',serif;font-size:20px;line-height:1.2;margin-top:1px;}
.day-pill.active .day-num{color:#F9F5EE;}
.dot{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:4px;opacity:0;}
.day-pill.has-done .dot{opacity:1;}

/* ── PROGRESS ── */
.progress-wrap{padding:14px 20px 10px;background:var(--warm);}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px;}
.progress-track{background:rgba(28,26,23,0.12);border-radius:4px;height:6px;overflow:hidden;}
.progress-fill{height:100%;background:#C4622D;border-radius:4px;transition:width .5s ease;}

/* ── CALENDAR HINT ── */
.cal-hint{margin:14px 20px 0;background:#D4E0EF;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;}
.cal-hint p{font-size:12.5px;color:#3B5F8A;line-height:1.4;flex:1;}
.cal-hint button{flex-shrink:0;padding:6px 14px;background:#3B5F8A;color:white;border:none;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;}

/* ── MOTIVATION BANNER ── */
.motiv-banner{margin:14px 20px 0;background:linear-gradient(135deg,#2A4A45 0%,#3A5E58 100%);border-radius:16px;padding:18px 20px;position:relative;}
.motiv-banner::before{content:'✦';position:absolute;right:18px;top:12px;font-size:38px;opacity:.07;color:#F9F5EE;pointer-events:none;}
.motiv-quote{font-family:'DM Serif Display',serif;font-style:italic;font-size:15px;color:#F9F5EE;line-height:1.6;margin-bottom:8px;}
.motiv-sub{font-size:13.5px;color:rgba(249,245,238,0.6);line-height:1.6;}
.motiv-tag{display:inline-block;margin-top:10px;padding:4px 10px;background:rgba(196,98,45,0.25);color:#D4825A;border-radius:20px;font-size:11px;font-weight:500;}

/* ── SCHEDULE ── */
.section-label{padding:16px 20px 4px;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:500;}
.schedule{padding:0 20px 16px 20px;display:flex;flex-direction:column;gap:10px;}
.block{border-radius:14px;padding:14px 16px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;transition:transform .15s;}
.block:active{transform:scale(0.98);}
.block.done{opacity:.5;}
.block.done .block-title{text-decoration:line-through;}
.block-check{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:2px;}
.block.done .block-check{background:currentColor;}
.block-check-inner{display:none;filter:invert(1);font-size:12px;}
.block.done .block-check-inner{display:block;}
.block-info{flex:1;}
.block-time{font-size:11px;font-weight:500;letter-spacing:.5px;opacity:.65;margin-bottom:2px;text-transform:uppercase;}
.block-title{font-family:'DM Serif Display',serif;font-size:16px;line-height:1.2;}
.block-sub{font-size:12px;opacity:.6;margin-top:2px;}
.block-emoji{font-size:22px;margin-top:2px;}

/* Block colors — explicit hex values to avoid any variable resolution issue */
.b-walk   {background:#EDE0F0 !important;color:#7B5EA7 !important;}
.b-deep   {background:#D6E9DC !important;color:#2D6A4F !important;}
.b-lunch  {background:#F2E8CF !important;color:#B8922A !important;}
.b-workout{background:#F0DDD3 !important;color:#C4622D !important;}
.b-light  {background:#D6E9DC !important;color:#2D6A4F !important;}
.b-family {background:#EDE0F0 !important;color:#7B5EA7 !important;}

/* Pomodoro trigger */

/* ── NOTE ── */
.note-area{margin:14px 20px 0;background:white;border-radius:14px;padding:14px 16px;border:1.5px solid rgba(28,26,23,0.08);}
.note-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:8px;}
.note-input{width:100%;border:none;outline:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);resize:none;min-height:60px;line-height:1.6;}
.note-input::placeholder{color:var(--muted);}

/* ── BOTTOM ACTIONS ── */
.bottom-actions{display:flex;gap:10px;padding:16px 20px 0;}
.action-btn{flex:1;padding:13px;border-radius:14px;border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-calendar{background:#1C1A17;color:#F9F5EE;}
.btn-reminders{background:#C4622D;color:white;}

/* ── WEEKEND ── */
.weekend-msg{margin:20px;padding:24px;background:var(--mauve);border-radius:16px;text-align:center;color:var(--mauve-dark);}
.weekend-msg .icon{font-size:36px;margin-bottom:10px;}
.weekend-msg h3{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:6px;}
.weekend-msg p{font-size:14px;opacity:.75;}

/* ── SUNFLOWER ANIMATION ── */
.sunflower-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden;}
.sunflower{position:absolute;animation:floatUp 1.8s ease-out forwards;opacity:0;}
@keyframes floatUp{
  0%  {opacity:0;transform:translateY(0) scale(.5) rotate(0deg);}
  20% {opacity:1;transform:translateY(-60px) scale(1.1) rotate(15deg);}
  80% {opacity:1;transform:translateY(-180px) scale(1) rotate(-10deg);}
  100%{opacity:0;transform:translateY(-260px) scale(.8) rotate(20deg);}
}

/* ── TOAST BANNER ── */
.toast{display:none;position:fixed;bottom:30px;left:20px;right:20px;background:#1C1A17;color:var(--cream);border-radius:16px;padding:16px 20px;z-index:999;animation:slideUp .4s ease;}
.toast.show{display:block;}
.toast-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:4px;}
.toast-sub{font-size:13px;color:rgba(249,245,238,.6);}
.toast-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--cream);font-size:18px;cursor:pointer;opacity:.6;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
</style>
</head>
<body>

<div class="sunflower-container" id="sunflowerContainer"></div>

<!-- MAIN APP -->
<div id="mainApp">

<header>
  <div class="header-title">Aggie's <em>Day</em></div>
  <div class="header-date" id="headerDate"></div>
  <div class="quick-links">
    <button class="quick-btn" onclick="openCalendar()">📅 Calendar</button>
    <button class="quick-btn" onclick="openReminders()">🔔 Reminders</button>
    <button class="quick-btn" onclick="openWeather()">🌤️ Weather</button>
  </div>
</header>

<div class="day-strip" id="dayStrip"></div>

<div class="progress-wrap">
  <div class="progress-label">
    <span>Today's progress</span>
    <span id="progressText">0 / 0 done</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="cal-hint">
  <p>Tap <strong>Calendar</strong> above to check your appointments for today.</p>
  <button onclick="openCalendar()">Open →</button>
</div>

<div class="motiv-banner">
  <div class="motiv-quote" id="motivQuote"></div>
  <div class="motiv-sub" id="motivSub"></div>
  <span class="motiv-tag">📖 PhD in progress</span>
</div>

<div class="section-label">Today's Blocks</div>
<div class="schedule" id="schedList"></div>

<div class="note-area">
  <div class="note-label">📝 Today's note</div>
  <textarea class="note-input" id="noteInput" placeholder="What do you want to focus on today?" rows="3"></textarea>
</div>

<div class="bottom-actions">
  <button class="action-btn btn-calendar" onclick="openCalendar()">📅 Open Calendar</button>
  <button class="action-btn btn-reminders" onclick="openReminders()">🔔 Open Reminders</button>
</div>

</div><!-- end mainApp -->

<!-- TOAST -->

<div class="toast" id="toast">
  <button class="toast-close" onclick="closeToast()">✕</button>
  <div class="toast-title" id="toastTitle"></div>
  <div class="toast-sub" id="toastSub"></div>
</div>

<script>
// ─────────────────────────────────────────────
// ICON GENERATION
// ─────────────────────────────────────────────
(function(){
  var canvas=document.createElement('canvas');
  canvas.width=512;canvas.height=512;
  var ctx=canvas.getContext('2d');
  var bg=ctx.createLinearGradient(0,0,512,512);
  bg.addColorStop(0,'#E8D5D0');bg.addColorStop(1,'#C9B8C4');
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.moveTo(100,0);ctx.lineTo(412,0);ctx.quadraticCurveTo(512,0,512,100);
  ctx.lineTo(512,412);ctx.quadraticCurveTo(512,512,412,512);ctx.lineTo(100,512);
  ctx.quadraticCurveTo(0,512,0,412);ctx.lineTo(0,100);ctx.quadraticCurveTo(0,0,100,0);
  ctx.closePath();ctx.fill();
  ctx.fillStyle='#5C3D4A';ctx.font='bold 260px Georgia,serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('A',258,248);
  var dataURL=canvas.toDataURL('image/png');
  var lnk=document.createElement('link');lnk.rel='apple-touch-icon';lnk.href=dataURL;
  document.head.appendChild(lnk);
})();

// ─────────────────────────────────────────────
// MAIN APP STATE
// ─────────────────────────────────────────────
var today=new Date();
var selectedDate=new Date(today);
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function dateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function loadDay(ds){
  try{
    return{
      done:JSON.parse(localStorage.getItem('ag_done_'+ds)||'{}'),
      note:localStorage.getItem('ag_note_'+ds)||''
    };
  }catch(e){return{done:{},note:''};}
}

function saveDay(ds,done,note){
  localStorage.setItem('ag_done_'+ds,JSON.stringify(done));
  localStorage.setItem('ag_note_'+ds,note);
}

// ─────────────────────────────────────────────
// SCHEDULE DEFINITION
// ─────────────────────────────────────────────
function getSchedule(dow){
  if(dow===0||dow===6) return null; // weekend

  // Wednesday
  if(dow===3){
    return[
      {id:'fam1',time:'Morning – 14:00',title:'Time with Your Daughter',sub:'Precious Wednesday morning together 🌸',emoji:'👧',color:'b-family'},
      {id:'light',time:'15:00 – 16:00',title:'Light PhD Work',sub:'If energy allows — no pressure',emoji:'🤓',color:'b-light'},
      {id:'fam2',time:'16:00 – 21:00',title:'Back to Your Daughter',sub:'Evening together 🌿',emoji:'👧',color:'b-family'}
    ];
  }

  var workout=(dow===2||dow===4); // Tue, Thu
  var blocks=[
    {id:'walk',time:'8:30 – 9:00',title:'Morning Walk',sub:'30 min outside',emoji:'🚶',color:'b-walk'},
    {id:'deep',time:'9:00 – 12:00',title:'Deep Work',sub:'PhD — protected focus time',emoji:'🤓',color:'b-deep'},
    {id:'lunch',time:'12:00 – 13:00',title:'Lunch Break',sub:workout?'Includes 30 min workout today 💪':'🦵 Gentle reminder: stretch your legs today?',emoji:'🍽️',color:'b-lunch'}
  ];
  if(workout){
    blocks.push({id:'workout',time:'12:00 – 12:30',title:'Workout',sub:'During lunch — 30 min',emoji:'💪',color:'b-workout'});
  }
  blocks.push(
    {id:'light',time:'13:30 – 15:00',title:'Light PhD Work',sub:'Admin, emails, reading',emoji:'📚',color:'b-light'},
    {id:'family',time:'16:00 – 21:00',title:'Quiet Time',sub:'With your daughter 🌿',emoji:'👧',color:'b-family'}
  );
  return blocks;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderHeader(){
  var d=selectedDate;
  document.getElementById('headerDate').textContent=DAYS[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate();
}

function renderDayStrip(){
  var strip=document.getElementById('dayStrip');
  strip.innerHTML='';
  for(var i=-3;i<=3;i++){
    var d=new Date(today);
    d.setDate(today.getDate()+i);
    var ds=dateStr(d);
    var info=loadDay(ds);
    var hasDone=Object.values(info.done).some(Boolean);
    var isActive=dateStr(d)===dateStr(selectedDate);
    var pill=document.createElement('div');
    pill.className='day-pill'+(isActive?' active':'')+(hasDone?' has-done':'');
    pill.innerHTML='<div class="day-name">'+DAYS[d.getDay()]+'</div><div class="day-num">'+d.getDate()+'</div><div class="dot"></div>';
    (function(date){
      pill.addEventListener('click',function(){selectedDate=date;renderAll();});
    })(new Date(d));
    strip.appendChild(pill);
  }
}

function renderSchedule(){
  var list=document.getElementById('schedList');
  list.innerHTML='';
  var dow=selectedDate.getDay();
  var schedule=getSchedule(dow);
  var ds=dateStr(selectedDate);
  var info=loadDay(ds);
  document.getElementById('noteInput').value=info.note;

  if(!schedule){
    list.innerHTML='<div class="weekend-msg"><div class="icon">🌸</div><h3>Rest day</h3><p>No structured schedule today.<br>Enjoy your time!</p></div>';
    updateProgress({},0);
    return;
  }

  schedule.forEach(function(block){
    var isDone=!!info.done[block.id];
    var div=document.createElement('div');
    div.className='block '+block.color+(isDone?' done':'');
    div.innerHTML=
      '<div class="block-check"><span class="block-check-inner">✓</span></div>'+
      '<div class="block-info">'+
        '<div class="block-time">'+block.time+'</div>'+
        '<div class="block-title">'+block.title+'</div>'+
        (block.sub?'<div class="block-sub">'+block.sub+'</div>':'')+
      '</div>'+
      '<div class="block-emoji">'+block.emoji+'</div>';
    (function(b,el){
      el.addEventListener('click',function(){toggleBlock(b.id,el);});
    })(block,div);
    list.appendChild(div);
  });

  updateProgress(info.done,schedule.length);
}

function updateProgress(done,total){
  var count=Object.values(done).filter(Boolean).length;
  var pct=total>0?Math.round(count/total*100):0;
  document.getElementById('progressText').textContent=count+' / '+total+' done';
  document.getElementById('progressFill').style.width=pct+'%';
}

function toggleBlock(id,el){
  var ds=dateStr(selectedDate);
  var info=loadDay(ds);
  var wasOff=!info.done[id];
  info.done[id]=wasOff;
  saveDay(ds,info.done,info.note);
  if(wasOff&&el) launchSunflowers(el);
  renderAll();
}

function renderAll(){
  renderHeader();
  renderDayStrip();
  renderSchedule();
}

// ─────────────────────────────────────────────
// NOTE
// ─────────────────────────────────────────────
document.getElementById('noteInput').addEventListener('input',function(){
  var ds=dateStr(selectedDate);
  var info=loadDay(ds);
  saveDay(ds,info.done,this.value);
});

// ─────────────────────────────────────────────
// EXTERNAL LINKS
// ─────────────────────────────────────────────
function openWeather(){
  window.location.href='weather://';
  setTimeout(function(){window.open('https://weather.com','_blank');},800);
}
function openCalendar(){
  window.location.href='calshow://';
  setTimeout(function(){window.open('https://www.icloud.com/calendar/','_blank');},800);
}
function openReminders(){
  window.location.href='x-apple-reminderkit://';
  setTimeout(function(){window.open('https://www.icloud.com/reminders/','_blank');},800);
}

// ─────────────────────────────────────────────
// MOTIVATIONAL QUOTES
// ─────────────────────────────────────────────
var quotes=[
  {q:"Every page you write today is a page closer to done.",s:"Your years of work matter. Keep going, Aggie. 🤓"},
  {q:"A PhD is not a sprint — it's a long, brave act of curiosity.",s:"You're doing something most people never dare to start."},
  {q:"The mornings you protect are the ones that change everything.",s:"Deep work is a gift you give your future self."},
  {q:"You are building something no one else could build.",s:"Your research is uniquely yours. That's extraordinary."},
  {q:"Hard days are part of the work, not a sign it's wrong.",s:"Rest when you need to. Then return. That's the whole secret."},
  {q:"Even slow progress is still progress.",s:"A paragraph, an idea, a rereading — all of it counts."},
  {q:"You show up for your daughter and for your thesis.",s:"Doing both takes real courage and real love."},
  {q:"American civilization chose you as much as you chose it.",s:"Your perspective on this field is rare and valuable."},
  {q:"The dissertation exists because you keep showing up.",s:"One word, one paragraph, one chapter at a time."},
  {q:"You are not behind. You are exactly where you need to be.",s:"Trust the process, Aggie. It's working."},
  {q:"Every scholar you admire once sat where you sit now.",s:"They finished. So will you."},
  {q:"Protecting your mornings is an act of self-respect.",s:"The world can wait until 9am."},
  {q:"Your daughter sees a mom who never gives up.",s:"That's one of the greatest gifts you can give her."},
  {q:"A walk, a coffee, a deep breath — then back to the work.",s:"Small rituals make big things possible."},
  {q:"Fatigue is not failure. Rest is part of the research.",s:"Come back tomorrow. The words will still be there."},
  {q:"You chose a hard path because easy paths weren't enough.",s:"That says everything about who you are."},
  {q:"The defense is coming. And you will be ready.",s:"Not because it's perfect — because you will be prepared."},
  {q:"Writing a PhD as a mom is twice the courage.",s:"Never forget how remarkable that is."},
  {q:"Some days the best research is just showing up.",s:"Open the document. Start anywhere. Keep going."},
  {q:"Your curiosity brought you here. Let it carry you through.",s:"The questions you ask matter deeply."},
  {q:"Every footnote, every draft, every late night counts.",s:"You are building something real and lasting."},
  {q:"The finish line exists. You are moving toward it.",s:"Keep your eyes on the defense day, Aggie. 🎓"},
  {q:"Be gentle with yourself today.",s:"You are a human being first, a PhD student second. 💜"},
  {q:"Your best today is enough. It has always been enough.",s:"You don't need to earn your rest, Aggie."}
];

// Wednesday-only quotes — rest, family, recharging
var wednesdayQuotes=[
  {q:"Today is yours. Fully, completely, gently yours.",s:"There is nowhere else you need to be right now. 🌸"},
  {q:"Rest is not something you earn. It's something you deserve.",s:"Let today be soft and full of good things, Aggie. 💜"},
  {q:"Being present with your daughter today is not time away from your PhD.",s:"It is time that will make you stronger for it. 🌿"},
  {q:"You give so much. Today, let yourself receive.",s:"Receive the quiet, the play, the laughter. You need it too."},
  {q:"A Wednesday well lived is fuel for everything else.",s:"Be here fully today — your research will thank you. 💛"},
  {q:"You are a wonderful mom and a brilliant researcher.",s:"Today, just be the mom. That is more than enough. 🌸"},
  {q:"Slow down today. Notice the small things.",s:"They are often the most important ones."}
];

function renderMotiv(){
  var now=new Date();
  var isWed=now.getDay()===3;
  var pool=isWed?wednesdayQuotes:quotes;
  var dayOfYear=Math.floor((now-new Date(now.getFullYear(),0,0))/86400000);
  var q=pool[dayOfYear%pool.length];
  document.getElementById('motivQuote').textContent='"'+q.q+'"';
  document.getElementById('motivSub').textContent=q.s;
}

// ─────────────────────────────────────────────
// SUNFLOWERS
// ─────────────────────────────────────────────
function launchSunflowers(originEl){
  var container=document.getElementById('sunflowerContainer');
  var rect=originEl.getBoundingClientRect();
  var flowers=['🌻','🌻','🌻','🌻','🌻','🌻'];
  for(var i=0;i<6;i++){
    (function(i){
      var el=document.createElement('div');
      el.className='sunflower';
      el.textContent=flowers[i];
      el.style.left=(rect.left+rect.width/2+(Math.random()-.5)*130)+'px';
      el.style.top=(rect.top+rect.height/2)+'px';
      el.style.animationDelay=(i*.12)+'s';
      el.style.fontSize=(20+Math.random()*16)+'px';
      container.appendChild(el);
      setTimeout(function(){el.remove();},2200);
    })(i);
  }
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
var toastTimer=null;
function showToast(title,sub){
  document.getElementById('toastTitle').textContent=title;
  document.getElementById('toastSub').textContent=sub;
  document.getElementById('toast').classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(closeToast,5000);
}
function closeToast(){
  document.getElementById('toast').classList.remove('show');
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
renderMotiv();
renderAll();
</script>
